http {
    upstream app_servers {
        server 192.168.1.1; # IP of app-server-1
        server 192.168.1.2; # IP of app-server-2
    }

    server {
        listen 80;

        location /app1 {
            proxy_pass http://192.168.1.1; # Route traffic to app-server-1
        }

        location /app2 {
            proxy_pass http://192.168.1.2; # Route traffic to app-server-2
        }

        location / {
            proxy_pass http://app_servers; # Load balancing for all other requests
        }
    }
}
